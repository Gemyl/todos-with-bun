services:
  # web:
  #   container_name: "${PROJECT_NAME}_front"
  #   #update image: change tag version in image to the next release (ex. image: joue-front:v0.1.2)
  #   #!REMEMBER TO DELETE PREVIOUS IMAGE VERSIONS
  #   image: joue-front:v1.0.1
  #   environment:
  #     NODE_ENV: production
  #   build:
  #     context: ./frontend
  #     args:
  #       NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL}
  #       NEXT_PUBLIC_ASSETS_URL: ${NEXT_PUBLIC_ASSETS_URL}
  #       NEXT_PUBLIC_SW_URL: ${NEXT_PUBLIC_SW_URL}
  #       NEXT_PUBLIC_DEFAULT_AVATAR: ${NEXT_PUBLIC_DEFAULT_AVATAR}
  #   labels:
  #     - "traefik.http.services.${PROJECT_NAME}_front.loadbalancer.server.port=3000"
  #     - "traefik.http.routers.${PROJECT_NAME}_front.rule=Host(`${PROJECT_BASE_URL}`)"

  database:
    container_name: "${PROJECT_NAME}_db"
    image: postgis/postgis:16-3.4
    volumes:
      - summon_dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB

  cache:
    container_name: "${PROJECT_NAME}_redis"
    image: redis:6

  directus:
    container_name: "${PROJECT_NAME}_directus"
    image: directus/directus:11.0.2
    volumes:
      # By default, uploads are stored in /directus/uploads
      # Always make sure your volumes matches the storage root when using
      # local driver
      - ./backend/uploads:/directus/uploads
      # Make sure to also mount the volume when using SQLite
      # - ./database:/directus/database
      # If you want to load extensions from the host
      - ./backend/extensions:/directus/extensions
    depends_on:
      - cache
      - database
    environment:
      KEY: $KEY
      SECRET: $SECRET

      #PUBLIC_URL: $PUBLIC_URL

      DB_CLIENT: $DB_CLIENT
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_DATABASE: $POSTGRES_DB
      DB_USER: $POSTGRES_USER
      DB_PASSWORD: $POSTGRES_PASSWORD

      CACHE_ENABLED: $CACHE_ENABLED
      CACHE_STORE: $CACHE_STORE
      REDIS_HOST: $REDIS_HOST
      REDIS_PORT: $REDIS_PORT
      ADMIN_EMAIL: $ADMIN_EMAIL
      ADMIN_PASSWORD: $ADMIN_PASSWORD
      TELEMETRY: false

      CORS_ENABLED: $CORS_ENABLED
      CORS_ORIGIN: $CORS_ORIGIN

      ACCESS_TOKEN_TTL: $ACCESS_TOKEN_TTL
      REFRESH_TOKEN_TTL: $REFRESH_TOKEN_TTL
      SESSION_COOKIE_TTL: $SESSION_COOKIE_TTL
      SESSION_COOKIE_DOMAIN: $SESSION_COOKIE_DOMAIN

      CACHE_TTL: $CACHE_TTL

      EMAIL_TRANSPORT: $EMAIL_TRANSPORT
      EMAIL_FROM: $EMAIL_FROM
      EMAIL_SMTP_HOST: $EMAIL_SMTP_HOST
      EMAIL_SMTP_PORT: $EMAIL_SMTP_PORT
      EMAIL_SMTP_NAME: $EMAIL_SMTP_NAME
      EMAIL_SMTP_USER: $EMAIL_SMTP_USER
      EMAIL_SMTP_PASSWORD: $EMAIL_SMTP_PASSWORD
      EMAIL_SMTP_SECURE: $EMAIL_SMTP_SECURE
      EMAIL_SMTP_IGNORE_TLS: $EMAIL_SMTP_IGNORE_TLS

      PASSWORD_RESET_URL_ALLOW_LIST: $PASSWORD_RESET_URL_ALLOW_LIST

      # Make sure to set this in production
      # (see https://docs.directus.io/configuration/config-options/#general)
      # PUBLIC_URL: 'https://directus.example.com'

    labels:
      - "traefik.http.services.${PROJECT_NAME}_directus.loadbalancer.server.port=8055"
      - "traefik.http.routers.${PROJECT_NAME}_directus.rule=Host(`app.${PROJECT_BASE_URL}`)"

  traefik:
    image: traefik
    container_name: "${PROJECT_NAME}_traefik"
    command: --api.insecure=true --providers.docker
    ports:
      - "80:80"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  summon_dbdata:
    external: true
